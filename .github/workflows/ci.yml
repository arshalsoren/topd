# Runs on every pull request and every push to master.
# Mirrors the local verification commands in README.md and CONTRIBUTING.md.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Release build (no warnings allowed)
        run: swift build -c release --product topd -Xswiftc -warnings-as-errors

      - name: Behavior checks
        run: swift run topd-checks
